name: Build

# Trigger when a pull request is received
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v3

    # The toolchain is pinned Docker images (tools/dev/toolchain.sh): the
    # runner needs only Docker, git and bash.
    - name: Build the three release images
      run: ./build.sh all

    - name: Keep the images
      uses: actions/upload-artifact@v4
      with:
        name: rescue-images
        path: dist/*/*.img
        if-no-files-found: error
